name: Stock Drop Alerts

on:
  schedule:
    # Backup only; cron-job.org triggering workflow_dispatch is the primary schedule.
    - cron: "8,23,38,53 13-21 * * 1-5"
  workflow_dispatch: {}

# Runs must not overlap: they read and write the same CSV/state files.
concurrency:
  group: stock-alerts
  cancel-in-progress: false

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to commit the data files back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert check
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_alerts.py

      - name: Persist data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alert_state.json history.csv breaks.csv
          git diff --staged --quiet || git commit -m "Update alert data [skip ci]"
          git pull --rebase origin main
          git push
