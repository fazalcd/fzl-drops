name: Stock Drop Alerts

on:
  schedule:
    # Backup schedule only - offset off the congested :00/:15/:30/:45 marks.
    # This alone is NOT relied on for timely execution; the external
    # cron-job.org trigger (calling workflow_dispatch below) is the
    # primary schedule. This just acts as a safety net in case the
    # external trigger ever fails to fire.
    - cron: "8,23,38,53 13-21 * * 1-5"
  workflow_dispatch: {} # triggered externally by cron-job.org on a reliable schedule

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to commit the updated alert_state.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alert check
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_alerts.py

      - name: Persist alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add alert_state.json
          git diff --staged --quiet || git commit -m "Update alert state [skip ci]"
          git push
